repos:
  # ============================================================================
  # STANDARD PRE-COMMIT QUALITY & SAFETY (AWS LABS STANDARD)
  # ============================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=102400"] # Block commits > 100MB
      - id: no-commit-to-branch
        args: ["--branch", "main", "--branch", "master"]
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-json
        exclude: '(package-lock\.json$|node_modules/)'
      - id: check-merge-conflict
      - id: detect-private-key
        exclude: '(node_modules/|\.venv/)'

  # ============================================================================
  # SECURITY, IAC & DEVSECOPS AUDIT GATES
  # ============================================================================
  - repo: local
    hooks:
      - id: gitleaks
        name: GitLeaks Secret Scan
        entry: gitleaks protect --staged --verbose
        language: system
        pass_filenames: false

      - id: sensitive-data-pii-check
        name: Sensitive Data & PII Guard (AWS Labs Standard)
        entry: bash scripts/pii_guard.sh
        language: system
        pass_filenames: false

      - id: checkov
        name: Checkov IaC Security Scanner
        entry: checkov --config-file .checkov.yaml
        language: system
        files: ^infra/modules/.*\.ya?ml$
        pass_filenames: false

      - id: cfn-lint
        name: CloudFormation Linter (cfn-lint)
        entry: cfn-lint --non-zero-exit-code error infra/modules/*.yaml
        language: system
        files: ^infra/modules/.*\.ya?ml$
        pass_filenames: false

      - id: test-api
        name: Automated API & Dependency Tests
        entry: node test/test_api.js
        language: system
        pass_filenames: false

      - id: oidc-security-check
        name: Enforce OIDC Security (No Static Keys)
        entry: bash scripts/oidc_check.sh
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
        pass_filenames: false
