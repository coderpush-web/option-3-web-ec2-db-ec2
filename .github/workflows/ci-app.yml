name: CI - Application Tests

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]
  workflow_dispatch:

concurrency:
  group: ci-app-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-application:
    name: Test Application & Build React
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install Dependencies
        run: |
          cd app
          npm ci

      - name: Run Automated Unit & Integration Tests
        run: |
          node test/test_api.js
          echo "✅ Automated tests passed successfully!"

      - name: Validate Next.js Build
        run: |
          cd app
          npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
