name: CD - Deploy Infrastructure

on:
  workflow_run:
    workflows: ["CD - Build & Push Image to ECR"]
    branches: [main]
    types:
      - completed
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment (dev or prod)'
        required: true
        default: 'prod'
        type: choice
        options:
          - prod
          - dev
      image_tag:
        description: 'Docker image tag (optional, defaults to latest for prod, dev-latest for dev)'
        required: false
        default: ''

concurrency:
  group: deploy-infra-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy-infra:
    name: Deploy Infrastructure (CloudFormation)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Set Environment & Tags
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV_NAME="${{ inputs.environment }}"
            if [ -n "${{ inputs.image_tag }}" ]; then
              IMAGE_TAG="${{ inputs.image_tag }}"
            elif [ "$ENV_NAME" = "prod" ]; then
              IMAGE_TAG="latest"
            else
              IMAGE_TAG="dev-latest"
            fi
          else
            ENV_NAME="prod"
            IMAGE_TAG="latest"
          fi
          echo "ENV_NAME=$ENV_NAME" >> $GITHUB_OUTPUT
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Configure AWS Credentials
        if: env.AWS_ACCESS_KEY_ID != ''
        uses: aws-actions/configure-aws-credentials@v4
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-southeast-1' }}

      - name: Deploy Infrastructure Stacks via CloudFormation
        if: env.AWS_ACCESS_KEY_ID != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          ENV_NAME: ${{ steps.vars.outputs.ENV_NAME }}
          IMAGE_TAG: ${{ steps.vars.outputs.IMAGE_TAG }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'ap-southeast-1' }}
        run: |
          echo "🚀 Starting CloudFormation infrastructure deployment for $ENV_NAME environment..."
          cd infra

          echo "1. Deploying Network Module ($ENV_NAME-network)..."
          aws cloudformation deploy \
            --template-file modules/vpc-subnets.yaml \
            --stack-name "$ENV_NAME-network" \
            --parameter-overrides EnvironmentName="$ENV_NAME" \
            --no-fail-on-empty-changeset \
            --region "$AWS_REGION"

          echo "2. Deploying Security Groups Module ($ENV_NAME-security-groups)..."
          aws cloudformation deploy \
            --template-file modules/security-groups.yaml \
            --stack-name "$ENV_NAME-security-groups" \
            --parameter-overrides EnvironmentName="$ENV_NAME" \
            --no-fail-on-empty-changeset \
            --region "$AWS_REGION"

          echo "3. Deploying IAM SSM & ECR Module ($ENV_NAME-iam)..."
          aws cloudformation deploy \
            --template-file modules/iam-roles.yaml \
            --stack-name "$ENV_NAME-iam" \
            --parameter-overrides EnvironmentName="$ENV_NAME" \
            --capabilities CAPABILITY_IAM \
            --no-fail-on-empty-changeset \
            --region "$AWS_REGION"

          echo "4. Deploying Application Compute Stack ($ENV_NAME-app)..."
          PARAM_ARGS="EnvironmentName=$ENV_NAME ImageTag=$IMAGE_TAG"
          if [ -f "environments/$ENV_NAME.json" ]; then
            EXTRA_PARAMS=$(python3 -c "
          import json
          try:
              with open('environments/$ENV_NAME.json') as f:
                  d = json.load(f).get('Parameters', {})
              d.pop('ImageTag', None)
              print(' '.join(f'{k}={v}' for k, v in d.items()))
          except Exception:
              pass
          " 2>/dev/null || true)
            if [ -n "$EXTRA_PARAMS" ]; then
              PARAM_ARGS="$EXTRA_PARAMS ImageTag=$IMAGE_TAG"
            fi
          fi

          aws cloudformation deploy \
            --template-file modules/app.yaml \
            --stack-name "$ENV_NAME-opt3-app" \
            --parameter-overrides $PARAM_ARGS \
            --capabilities CAPABILITY_IAM \
            --no-fail-on-empty-changeset \
            --region "$AWS_REGION"

          echo "5. Triggering Zero-Downtime Instance Refresh ($ENV_NAME-opt3-asg)..."
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "$ENV_NAME-opt3-asg" \
            --preferences '{"MinHealthyPercentage": 50, "InstanceWarmup": 180}' \
            --region "$AWS_REGION" 2>/dev/null || echo "Instance refresh already in progress or not applicable."

          echo "=== CloudFormation Stack Outputs ==="
          aws cloudformation describe-stacks \
            --stack-name "$ENV_NAME-opt3-app" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[*].[OutputKey,OutputValue]" \
            --output table 2>/dev/null || true

          echo "✅ CloudFormation deployment completed successfully!"
