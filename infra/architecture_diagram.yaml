Diagram:
  DefinitionFiles:
    - Type: URL
      Url: "https://raw.githubusercontent.com/awslabs/diagram-as-code/main/definitions/definition-for-aws-icons-light.yaml"

  Resources:
    Canvas:
      Type: AWS::Diagram::Canvas
      Direction: vertical
      Children:
        - AWSCloud
        - CloudFront
        - CloudflareEdge
        - User

    User:
      Type: AWS::Diagram::Resource
      Preset: User
      Title: "User"

    CloudflareEdge:
      Type: AWS::Diagram::Resource
      Preset: Internet
      Title: "Cloudflare Proxy (CDN/WAF)\nopt3.png261.dev"

    CloudFront:
      Type: AWS::Diagram::Resource
      Preset: "Amazon CloudFront"
      Title: "Amazon CloudFront\n(Static Cache & Edge)"

    AWSCloud:
      Type: AWS::Diagram::Cloud
      Direction: horizontal
      Preset: AWSCloudNoLogo
      Align: center
      Children:
        - VPC
        - ECR

    ECR:
      Type: AWS::ECR
      Title: "Amazon ECR\n(App Image Repository)"

    VPC:
      Type: AWS::EC2::VPC
      Title: "VPC (10.0.0.0/16)"
      Direction: vertical
      Children:
        - MainStack
        - PublicSubnetALB
      BorderChildren:
        - Position: S
          Resource: IGW

    PublicSubnetALB:
      Type: AWS::EC2::Subnet
      Preset: PublicSubnet
      Title: "Public Subnets (ALB & NAT Tier)"
      Children:
        - ALB
        - NATGW

    ALB:
      Type: AWS::ElasticLoadBalancingV2::LoadBalancer
      Preset: Application Load Balancer
      Title: "Application Load Balancer"

    NATGW:
      Type: AWS::EC2::NatGateway
      Title: "NAT Gateway (Egress)"

    MainStack:
      Type: AWS::Diagram::HorizontalStack
      Children:
        - WebASG
        - PrivateSubnetDB

    WebASG:
      Type: AWS::AutoScaling::AutoScalingGroup
      Title: "Web Auto Scaling Group (Private Subnets)"
      Children:
        - WebSubnet1
        - WebSubnet2

    WebSubnet1:
      Type: AWS::EC2::Subnet
      Preset: PrivateSubnet
      Title: "Private Subnet 1 (App)"
      Children:
        - WebInstance1

    WebInstance1:
      Type: AWS::EC2::Instance
      Title: "Web Instance 1"

    WebSubnet2:
      Type: AWS::EC2::Subnet
      Preset: PrivateSubnet
      Title: "Private Subnet 2 (App)"
      Children:
        - WebInstance2

    WebInstance2:
      Type: AWS::EC2::Instance
      Title: "Web Instance 2"

    PrivateSubnetDB:
      Type: AWS::EC2::Subnet
      Preset: PrivateSubnet
      Title: "Private Subnet (DB Tier)"
      Children:
        - DBInstance

    DBInstance:
      Type: AWS::EC2::Instance
      Title: "Dedicated MariaDB"

    IGW:
      Type: AWS::EC2::InternetGateway
      IconFill:
        Type: rect

  Links:
    - Source: User
      SourcePosition: N
      Target: CloudflareEdge
      TargetPosition: S
      TargetArrowHead:
        Type: Open
      Type: orthogonal
      Labels:
        SourceLeft:
          Title: "HTTPS:443"
    - Source: CloudflareEdge
      SourcePosition: N
      Target: CloudFront
      TargetPosition: S
      TargetArrowHead:
        Type: Open
      Type: orthogonal
      Labels:
        SourceLeft:
          Title: "HTTPS:443"
    - Source: CloudFront
      SourcePosition: N
      Target: IGW
      TargetPosition: S
      TargetArrowHead:
        Type: Open
      Type: orthogonal
      Labels:
        SourceLeft:
          Title: "HTTP:80"
    - Source: IGW
      SourcePosition: N
      Target: ALB
      TargetPosition: S
      TargetArrowHead:
        Type: Open
      Type: orthogonal
    - Source: ALB
      SourcePosition: NW
      Target: WebInstance1
      TargetPosition: S
      TargetArrowHead:
        Type: Open
      Type: orthogonal
    - Source: ALB
      SourcePosition: NE
      Target: WebInstance2
      TargetPosition: S
      TargetArrowHead:
        Type: Open
      Type: orthogonal
    - Source: WebInstance1
      SourcePosition: E
      Target: DBInstance
      TargetPosition: W
      TargetArrowHead:
        Type: Open
      Type: orthogonal
      Labels:
        SourceRight:
          Title: "Port 3306"
    - Source: WebInstance2
      SourcePosition: E
      Target: DBInstance
      TargetPosition: W
      TargetArrowHead:
        Type: Open
      Type: orthogonal
    - Source: WebInstance1
      SourcePosition: NW
      Target: NATGW
      TargetPosition: S
      TargetArrowHead:
        Type: Open
      Type: orthogonal
      Labels:
        SourceLeft:
          Title: "Egress"
    - Source: NATGW
      SourcePosition: E
      Target: ECR
      TargetPosition: W
      TargetArrowHead:
        Type: Open
      Type: orthogonal
      Labels:
        SourceRight:
          Title: "Pull Image"
