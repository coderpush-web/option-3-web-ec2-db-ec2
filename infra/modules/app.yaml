AWSTemplateFormatVersion: '2010-09-09'
Description: 'Application Compute Module: Option 3 - Auto Scaling EC2 Web (ALB + ASG) + Dedicated Single EC2 MariaDB'

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]

  InstanceType:
    Type: String
    Default: t3.micro

  WebVolumeSize:
    Type: Number
    Default: 20

  DBVolumeSize:
    Type: Number
    Default: 30

  DBPassword:
    Type: String
    NoEcho: true
    Default: SecretDBPass123!

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

  ImageTag:
    Type: String
    Default: latest

  SubdomainName:
    Type: String
    Default: opt3-dev.png261.dev

  MinInstances:
    Type: Number
    Default: 1
    Description: Minimum instances in Auto Scaling Group

  MaxInstances:
    Type: Number
    Default: 4
    Description: Maximum instances in Auto Scaling Group

  DesiredInstances:
    Type: Number
    Default: 1
    Description: Desired instances in Auto Scaling Group

  CertificateArn:
    Type: String
    Default: 'arn:aws:acm:ap-southeast-1:649519997247:certificate/3565f62c-9fd6-4aec-bb6a-5182e3337479'
    Description: ACM Certificate ARN for HTTPS ALB listener (*.png261.dev)

Conditions:
  HasCertificateArn: !Not [!Equals [!Ref CertificateArn, '']]

Resources:
  AppECRRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub '${EnvironmentName}-option-3-web-app'
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep last 5 images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 5
                },
                "action": {
                  "type": "expire"
                }
              }
            ]
          }
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-option-3-ecr'
        - Key: Environment
          Value: !Ref EnvironmentName

  DBServerInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref LatestAmiId
      IamInstanceProfile:
        Fn::ImportValue: !Sub '${EnvironmentName}-EC2InstanceProfileName'
      SubnetId:
        Fn::ImportValue: !Sub '${EnvironmentName}-PrivateSubnet1Id'
      SecurityGroupIds:
        - Fn::ImportValue: !Sub '${EnvironmentName}-DatabaseSecurityGroupId'
      MetadataOptions:
        HttpTokens: required
        HttpPutResponseHopLimit: 1
        HttpEndpoint: enabled
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: !Ref DBVolumeSize
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      UserData:
        Fn::Base64: !Sub
          - |
            #!/bin/bash
            set -e
            dnf install -y mariadb105-server

            sed -i 's/^bind-address.*/bind-address = 0.0.0.0/' /etc/my.cnf.d/mariadb-server.cnf 2>/dev/null || true
            systemctl enable mariadb
            systemctl start mariadb

            mysql -e "CREATE DATABASE IF NOT EXISTS appdb;"
            mysql -e "CREATE USER IF NOT EXISTS 'appuser'@'%' IDENTIFIED BY '${Password}';"
            mysql -e "GRANT ALL PRIVILEGES ON appdb.* TO 'appuser'@'%';"
            mysql -e "FLUSH PRIVILEGES;"

            mysql -u appuser -p'${Password}' appdb -e "CREATE TABLE IF NOT EXISTS system_logs (id INT AUTO_INCREMENT PRIMARY KEY, service VARCHAR(50), message TEXT, created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP);"
            mysql -u appuser -p'${Password}' appdb -e "INSERT INTO system_logs (service, message) VALUES ('Database', 'Database Initialized on Dedicated EC2 Instance');"
          - Password: !Ref DBPassword
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-db-server'
        - Key: Environment
          Value: !Ref EnvironmentName

  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub '${EnvironmentName}-opt3-alb'
      Scheme: internet-facing
      Type: application
      Subnets:
        - Fn::ImportValue: !Sub '${EnvironmentName}-PublicSubnetId'
        - Fn::ImportValue: !Sub '${EnvironmentName}-PublicSubnet2Id'
      SecurityGroups:
        - Fn::ImportValue: !Sub '${EnvironmentName}-ALBSecurityGroupId'
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-opt3-alb'
        - Key: Environment
          Value: !Ref EnvironmentName

  ALBTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${EnvironmentName}-opt3-tg'
      Port: 80
      Protocol: HTTP
      VpcId:
        Fn::ImportValue: !Sub '${EnvironmentName}-VpcId'
      TargetType: instance
      HealthCheckPath: /login
      HealthCheckPort: '80'
      HealthCheckProtocol: HTTP
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: 200-399
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '30'
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-opt3-tg'
        - Key: Environment
          Value: !Ref EnvironmentName

  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        !If
          - HasCertificateArn
          - - Type: redirect
              RedirectConfig:
                Protocol: HTTPS
                Port: '443'
                StatusCode: HTTP_301
          - - Type: forward
              TargetGroupArn: !Ref ALBTargetGroup

  ALBHttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasCertificateArn
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ALBTargetGroup

  WebLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub '${EnvironmentName}-opt3-web-lt'
      LaunchTemplateData:
        InstanceType: !Ref InstanceType
        ImageId: !Ref LatestAmiId
        IamInstanceProfile:
          Name:
            Fn::ImportValue: !Sub '${EnvironmentName}-EC2InstanceProfileName'
        SecurityGroupIds:
          - Fn::ImportValue: !Sub '${EnvironmentName}-WebSecurityGroupId'
        MetadataOptions:
          HttpTokens: required
          HttpPutResponseHopLimit: 1
          HttpEndpoint: enabled
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeSize: !Ref WebVolumeSize
              VolumeType: gp3
              Encrypted: true
              DeleteOnTermination: true
        UserData:
          Fn::Base64: !Sub
            - |
              #!/bin/bash
              set -e
              dnf install -y docker aws-cli
              systemctl enable docker
              systemctl start docker
              usermod -aG docker ec2-user

              AWS_REGION="${AWS::Region}"
              ACCOUNT_ID="${AWS::AccountId}"
              IMAGE_URI="${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${EnvironmentName}-option-3-web-app:${ImageTag}"

              echo "Logging into Amazon ECR..."
              for i in {1..5}; do
                aws ecr get-login-password --region "${AWS::Region}" | docker login --username AWS --password-stdin "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com" && break || sleep 5
              done

              echo "Pulling Docker image: $IMAGE_URI"
              for i in {1..5}; do
                docker pull "$IMAGE_URI" && break || sleep 5
              done

              cat << 'SVC' > /etc/systemd/system/react-webapp.service
              [Unit]
              Description=Dockerized React Web App connected to EC2 MariaDB
              After=docker.service
              Requires=docker.service

              [Service]
              TimeoutStartSec=0
              Restart=always
              ExecStartPre=-/usr/bin/docker stop react-webapp
              ExecStartPre=-/usr/bin/docker rm react-webapp
              ExecStart=/usr/bin/docker run --name react-webapp -p 80:80 \
                --log-driver=awslogs \
                --log-opt awslogs-region=${AWS::Region} \
                --log-opt awslogs-group=/aws/ec2/${EnvironmentName}-option-3-webapp \
                --log-opt awslogs-create-group=true \
                -e APP_ENV=${EnvironmentName} \
                -e PORT=80 \
                -e DB_HOST=${DBPrivateIp} \
                -e DB_USER=appuser \
                -e DB_PASSWORD=${Password} \
                -e DB_NAME=appdb \
                ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${EnvironmentName}-option-3-web-app:${ImageTag}
              ExecStop=/usr/bin/docker stop react-webapp

              [Install]
              WantedBy=multi-user.target
              SVC

              systemctl daemon-reload
              systemctl enable react-webapp
              systemctl start react-webapp || true
            - DBPrivateIp: !GetAtt DBServerInstance.PrivateIp
              Password: !Ref DBPassword
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: !Sub '${EnvironmentName}-opt3-web-asg-instance'
              - Key: Environment
                Value: !Ref EnvironmentName

  WebAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    UpdatePolicy:
      AutoScalingRollingUpdate:
        MinInstancesInService: 1
        MaxBatchSize: 1
        PauseTime: PT3M
    Properties:
      AutoScalingGroupName: !Sub '${EnvironmentName}-opt3-asg'
      LaunchTemplate:
        LaunchTemplateId: !Ref WebLaunchTemplate
        Version: !GetAtt WebLaunchTemplate.LatestVersionNumber
      MinSize: !Ref MinInstances
      MaxSize: !Ref MaxInstances
      DesiredCapacity: !Ref DesiredInstances
      VPCZoneIdentifier:
        - Fn::ImportValue: !Sub '${EnvironmentName}-PrivateSubnet1Id'
        - Fn::ImportValue: !Sub '${EnvironmentName}-PrivateSubnet2Id'
      TargetGroupARNs:
        - !Ref ALBTargetGroup
      HealthCheckType: ELB
      HealthCheckGracePeriod: 300
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-opt3-web-server'
          PropagateAtLaunch: true
        - Key: Environment
          Value: !Ref EnvironmentName
          PropagateAtLaunch: true

  WebCPUScalingPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref WebAutoScalingGroup
      PolicyType: TargetTrackingScaling
      TargetTrackingConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ASGAverageCPUUtilization
        TargetValue: 70.0

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub '${EnvironmentName} Option 3 Web Distribution'
        Enabled: true
        HttpVersion: http2and3
        PriceClass: PriceClass_All
        Origins:
          - Id: ALBOrigin
            DomainName: !GetAtt ApplicationLoadBalancer.DNSName
            CustomOriginConfig:
              HTTPPort: 80
              HTTPSPort: 443
              OriginProtocolPolicy: http-only
              OriginKeepaliveTimeout: 5
              OriginReadTimeout: 30
        DefaultCacheBehavior:
          TargetOriginId: ALBOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
            - PUT
            - POST
            - PATCH
            - DELETE
          CachedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          OriginRequestPolicyId: 216adef6-5c1d-47e7-81dd-c14a2a485ea9
          Compress: true
        CacheBehaviors:
          - PathPattern: '/_next/static/*'
            TargetOriginId: ALBOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
            CachedMethods:
              - GET
              - HEAD
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
            Compress: true
          - PathPattern: '/static/*'
            TargetOriginId: ALBOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
            CachedMethods:
              - GET
              - HEAD
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
            Compress: true
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-opt3-cf'
        - Key: Environment
          Value: !Ref EnvironmentName

Outputs:
  WebsiteURL:
    Description: Website URL via CloudFront CDN
    Value: !Sub 'https://${CloudFrontDistribution.DomainName}'
  CloudFrontDomainName:
    Description: CloudFront Distribution Domain Name
    Value: !GetAtt CloudFrontDistribution.DomainName
  CloudFrontDistributionId:
    Description: CloudFront Distribution ID
    Value: !Ref CloudFrontDistribution
  LoadBalancerDNS:
    Description: Application Load Balancer DNS Name
    Value: !GetAtt ApplicationLoadBalancer.DNSName
  ECRRepositoryUri:
    Description: ECR Repository URI
    Value: !GetAtt AppECRRepository.RepositoryUri
  LoadBalancerURL:
    Description: Direct Application Load Balancer URL
    Value: !Sub 'http://${ApplicationLoadBalancer.DNSName}'
  DBServerPrivateIP:
    Description: Private IP of Dedicated DB Server
    Value: !GetAtt DBServerInstance.PrivateIp
  CustomDomainURL:
    Description: Custom Domain Website URL
    Value: !Sub 'https://${SubdomainName}'
  DnsRecordType:
    Description: DNS Record Type
    Value: 'CNAME'
  DnsRecordName:
    Description: DNS Record Name
    Value: !Ref SubdomainName
  DnsRecordValue:
    Description: DNS Record Value (CloudFront Distribution Target)
    Value: !GetAtt CloudFrontDistribution.DomainName
  DNSSetupGuide:
    Description: Custom Domain DNS Setup Instructions
    Value: !Sub 'Add CNAME in DNS: ${SubdomainName} -> ${CloudFrontDistribution.DomainName} (DNS-only / no proxy).'

