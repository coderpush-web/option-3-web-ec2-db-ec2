AWSTemplateFormatVersion: '2010-09-09'
Description: 'Application Compute Module: Option 3 - Web on EC2 + DB on EC2'

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]

  InstanceType:
    Type: String
    Default: t3.micro
    Description: Instance type for Web & DB (t3.micro for dev, t3.small for prod)

  WebVolumeSize:
    Type: Number
    Default: 20

  DBVolumeSize:
    Type: Number
    Default: 30

  DBPassword:
    Type: String
    NoEcho: true
    Default: SecretDBPass123!

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Resources:
  DBServerInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref LatestAmiId
      IamInstanceProfile:
        Fn::ImportValue: !Sub '${EnvironmentName}-EC2InstanceProfileName'
      SubnetId:
        Fn::ImportValue: !Sub '${EnvironmentName}-PrivateSubnet1Id'
      SecurityGroupIds:
        - Fn::ImportValue: !Sub '${EnvironmentName}-DatabaseSecurityGroupId'
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: !Ref DBVolumeSize
            VolumeType: gp3
            DeleteOnTermination: true
      UserData:
        Fn::Base64: !Sub
          - |
            #!/bin/bash
            dnf update -y
            dnf install -y mariadb105-server

            sed -i 's/^bind-address.*/bind-address = 0.0.0.0/' /etc/my.cnf.d/mariadb-server.cnf 2>/dev/null || true
            systemctl enable mariadb
            systemctl start mariadb

            mysql -e "CREATE DATABASE IF NOT EXISTS appdb;"
            mysql -e "CREATE USER IF NOT EXISTS 'appuser'@'%' IDENTIFIED BY '${Password}';"
            mysql -e "GRANT ALL PRIVILEGES ON appdb.* TO 'appuser'@'%';"
            mysql -e "FLUSH PRIVILEGES;"
          - Password: !Ref DBPassword
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-db-server'
        - Key: Environment
          Value: !Ref EnvironmentName

  WebServerInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref LatestAmiId
      IamInstanceProfile:
        Fn::ImportValue: !Sub '${EnvironmentName}-EC2InstanceProfileName'
      SubnetId:
        Fn::ImportValue: !Sub '${EnvironmentName}-PublicSubnetId'
      SecurityGroupIds:
        - Fn::ImportValue: !Sub '${EnvironmentName}-WebSecurityGroupId'
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: !Ref WebVolumeSize
            VolumeType: gp3
            DeleteOnTermination: true
      UserData:
        Fn::Base64: !Sub
          - |
            #!/bin/bash
            dnf update -y
            dnf install -y nodejs npm

            mkdir -p /opt/app
            cat << 'EOF' > /opt/app/package.json
            {
              "name": "sample-web-app",
              "version": "1.0.0",
              "main": "server.js",
              "dependencies": {
                "express": "^4.19.2",
                "mysql2": "^3.9.7"
              }
            }
            EOF

            cat << 'EOF' > /opt/app/server.js
            const express = require('express');
            const mysql = require('mysql2/promise');
            const app = express();
            const port = 80;

            const pool = mysql.createPool({
              host: process.env.DB_HOST,
              user: process.env.DB_USER || 'appuser',
              password: process.env.DB_PASSWORD,
              database: process.env.DB_NAME || 'appdb',
              waitForConnections: true,
              connectionLimit: 5
            });

            app.get('/health', (req, res) => res.json({ status: 'ok', env: '${EnvTag}' }));
            app.get('/', async (req, res) => {
              let dbStatus = 'Checking...';
              try {
                const [rows] = await pool.query('SELECT 1 + 1 AS solution, NOW() as current_time');
                dbStatus = `Connected OK (Result: ` + rows[0].solution + `, Time: ` + rows[0].current_time + `)`;
              } catch (err) {
                dbStatus = 'Failed: ' + err.message;
              }
              res.send(`
                <!DOCTYPE html><html><body style="font-family:sans-serif;background:#f4f6f8;padding:40px;">
                <div style="background:white;padding:24px;border-radius:8px;max-width:600px;margin:0 auto;box-shadow:0 4px 6px rgba(0,0,0,0.1)">
                  <h1 style="color:#ff9900;">🚀 Option 3: 2 EC2 Instances (${EnvTag})</h1>
                  <p><strong>DB Connection:</strong> ` + dbStatus + `</p>
                  <p><strong>DB Host:</strong> ${DBIp}</p>
                  <p><strong>Environment:</strong> ${EnvTag}</p>
                </div></body></html>
              `);
            });
            app.listen(port, () => console.log('Listening on port ' + port));
            EOF

            cd /opt/app
            npm install

            cat << EOF > /etc/systemd/system/webapp.service
            [Unit]
            Description=Web App Service
            After=network.target

            [Service]
            Type=simple
            User=root
            WorkingDirectory=/opt/app
            Environment=DB_HOST=${DBIp}
            Environment=DB_USER=appuser
            Environment=DB_PASSWORD=${Password}
            Environment=DB_NAME=appdb
            ExecStart=/usr/bin/node /opt/app/server.js
            Restart=always

            [Install]
            WantedBy=multi-user.target
            EOF

            systemctl daemon-reload
            systemctl enable webapp
            systemctl start webapp
          - EnvTag: !Ref EnvironmentName
            DBIp: !GetAtt DBServerInstance.PrivateIp
            Password: !Ref DBPassword
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-web-server'
        - Key: Environment
          Value: !Ref EnvironmentName

  WebServerEIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      InstanceId: !Ref WebServerInstance
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-web-eip'
        - Key: Environment
          Value: !Ref EnvironmentName

Outputs:
  WebsiteURL:
    Description: Website URL
    Value: !Sub 'http://${WebServerEIP.PublicIp}'
  WebPublicIP:
    Description: Public IP of Web Server
    Value: !Ref WebServerEIP
  DBPrivateIP:
    Description: Private IP of Database Server
    Value: !GetAtt DBServerInstance.PrivateIp
