AWSTemplateFormatVersion: '2010-09-09'
Description: 'Application Compute Module: Option 3 - Auto Scaling EC2 Web (ALB + ASG) + Dedicated Single EC2 MariaDB'

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]

  InstanceType:
    Type: String
    Default: t3.micro

  WebVolumeSize:
    Type: Number
    Default: 20

  DBVolumeSize:
    Type: Number
    Default: 30

  DBPassword:
    Type: String
    NoEcho: true
    Default: SecretDBPass123!

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

  ImageTag:
    Type: String
    Default: latest

  DomainName:
    Type: String
    Default: png261.dev

  SubdomainName:
    Type: String
    Default: opt3-dev.png261.dev

  MinInstances:
    Type: Number
    Default: 1
    Description: Minimum instances in Auto Scaling Group

  MaxInstances:
    Type: Number
    Default: 4
    Description: Maximum instances in Auto Scaling Group

  DesiredInstances:
    Type: Number
    Default: 1
    Description: Desired instances in Auto Scaling Group

  CertificateArn:
    Type: String
    Default: 'arn:aws:acm:ap-southeast-1:649519997247:certificate/3565f62c-9fd6-4aec-bb6a-5182e3337479'
    Description: ACM Certificate ARN for HTTPS ALB listener (*.png261.dev)

  CloudflareOriginSecret:
    Type: String
    Default: ''
    NoEcho: true
    Description: Optional secret header value (X-Origin-Secret) to restrict ALB access only to Cloudflare proxy

Conditions:
  HasCertificateArn: !Not [!Equals [!Ref CertificateArn, '']]
  HasCloudflareSecret: !And
    - !Condition HasCertificateArn
    - !Not [!Equals [!Ref CloudflareOriginSecret, '']]

Resources:
  DBServerInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref LatestAmiId
      IamInstanceProfile:
        Fn::ImportValue: !Sub '${EnvironmentName}-EC2InstanceProfileName'
      SubnetId:
        Fn::ImportValue: !Sub '${EnvironmentName}-PrivateSubnet1Id'
      SecurityGroupIds:
        - Fn::ImportValue: !Sub '${EnvironmentName}-DatabaseSecurityGroupId'
      MetadataOptions:
        HttpTokens: required
        HttpPutResponseHopLimit: 1
        HttpEndpoint: enabled
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: !Ref DBVolumeSize
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      UserData:
        Fn::Base64: !Sub
          - |
            #!/bin/bash
            set -e
            dnf update -y
            dnf install -y mariadb105-server

            sed -i 's/^bind-address.*/bind-address = 0.0.0.0/' /etc/my.cnf.d/mariadb-server.cnf 2>/dev/null || true
            systemctl enable mariadb
            systemctl start mariadb

            mysql -e "CREATE DATABASE IF NOT EXISTS appdb;"
            mysql -e "CREATE USER IF NOT EXISTS 'appuser'@'%' IDENTIFIED BY '${Password}';"
            mysql -e "GRANT ALL PRIVILEGES ON appdb.* TO 'appuser'@'%';"
            mysql -e "FLUSH PRIVILEGES;"

            mysql -u appuser -p'${Password}' appdb -e "CREATE TABLE IF NOT EXISTS system_logs (id INT AUTO_INCREMENT PRIMARY KEY, service VARCHAR(50), message TEXT, created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP);"
            mysql -u appuser -p'${Password}' appdb -e "INSERT INTO system_logs (service, message) VALUES ('Database', 'Database Initialized on Dedicated EC2 Instance');"
          - Password: !Ref DBPassword
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-db-server'
        - Key: Environment
          Value: !Ref EnvironmentName

  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub '${EnvironmentName}-opt3-alb'
      Scheme: internet-facing
      Type: application
      Subnets:
        - Fn::ImportValue: !Sub '${EnvironmentName}-PublicSubnetId'
        - Fn::ImportValue: !Sub '${EnvironmentName}-PublicSubnet2Id'
      SecurityGroups:
        - Fn::ImportValue: !Sub '${EnvironmentName}-WebSecurityGroupId'
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-opt3-alb'
        - Key: Environment
          Value: !Ref EnvironmentName

  ALBTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${EnvironmentName}-opt3-tg'
      Port: 80
      Protocol: HTTP
      VpcId:
        Fn::ImportValue: !Sub '${EnvironmentName}-VpcId'
      TargetType: instance
      HealthCheckPath: /login
      HealthCheckPort: '80'
      HealthCheckProtocol: HTTP
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: 200-399
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-opt3-tg'
        - Key: Environment
          Value: !Ref EnvironmentName

  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        !If
          - HasCertificateArn
          - - Type: redirect
              RedirectConfig:
                Protocol: HTTPS
                Port: '443'
                StatusCode: HTTP_301
          - - Type: forward
              TargetGroupArn: !Ref ALBTargetGroup

  ALBHttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasCertificateArn
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        !If
          - HasCloudflareSecret
          - - Type: fixed-response
              FixedResponseConfig:
                ContentType: text/plain
                MessageBody: 'Direct origin access forbidden. Requests must route via Cloudflare proxy.'
                StatusCode: '403'
          - - Type: forward
              TargetGroupArn: !Ref ALBTargetGroup

  ALBCloudflareRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Condition: HasCloudflareSecret
    Properties:
      ListenerArn: !Ref ALBHttpsListener
      Priority: 1
      Conditions:
        - Field: http-header
          HttpHeaderConfig:
            HttpHeaderName: X-Origin-Secret
            Values:
              - !Ref CloudflareOriginSecret
      Actions:
        - Type: forward
          TargetGroupArn: !Ref ALBTargetGroup

  WebLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub '${EnvironmentName}-opt3-web-lt'
      LaunchTemplateData:
        InstanceType: !Ref InstanceType
        ImageId: !Ref LatestAmiId
        IamInstanceProfile:
          Name:
            Fn::ImportValue: !Sub '${EnvironmentName}-EC2InstanceProfileName'
        SecurityGroupIds:
          - Fn::ImportValue: !Sub '${EnvironmentName}-WebSecurityGroupId'
        MetadataOptions:
          HttpTokens: required
          HttpPutResponseHopLimit: 1
          HttpEndpoint: enabled
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeSize: !Ref WebVolumeSize
              VolumeType: gp3
              Encrypted: true
              DeleteOnTermination: true
        UserData:
          Fn::Base64: !Sub
            - |
              #!/bin/bash
              set -e
              dnf update -y
              dnf install -y docker aws-cli
              systemctl enable docker
              systemctl start docker
              usermod -aG docker ec2-user

              AWS_REGION="${AWS::Region}"
              ACCOUNT_ID="${AWS::AccountId}"
              IMAGE_URI="${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${EnvironmentName}-option-3-web-app:${ImageTag}"

              echo "Logging into Amazon ECR..."
              aws ecr get-login-password --region "${AWS::Region}" | docker login --username AWS --password-stdin "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com" || true

              echo "Pulling Docker image: $IMAGE_URI"
              docker pull "$IMAGE_URI" || true

              cat << 'SVC' > /etc/systemd/system/react-webapp.service
              [Unit]
              Description=Dockerized React Web App connected to EC2 MariaDB
              After=docker.service
              Requires=docker.service

              [Service]
              TimeoutStartSec=0
              Restart=always
              ExecStartPre=-/usr/bin/docker stop react-webapp
              ExecStartPre=-/usr/bin/docker rm react-webapp
              ExecStart=/usr/bin/docker run --name react-webapp -p 80:80 \
                -e APP_ENV=${EnvironmentName} \
                -e PORT=80 \
                -e DB_HOST=${DBPrivateIp} \
                -e DB_USER=appuser \
                -e DB_PASSWORD=${Password} \
                -e DB_NAME=appdb \
                ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${EnvironmentName}-option-3-web-app:${ImageTag}
              ExecStop=/usr/bin/docker stop react-webapp

              [Install]
              WantedBy=multi-user.target
              SVC

              systemctl daemon-reload
              systemctl enable react-webapp
              systemctl start react-webapp || true
            - DBPrivateIp: !GetAtt DBServerInstance.PrivateIp
              Password: !Ref DBPassword
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: !Sub '${EnvironmentName}-opt3-web-asg-instance'
              - Key: Environment
                Value: !Ref EnvironmentName

  WebAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      AutoScalingGroupName: !Sub '${EnvironmentName}-opt3-asg'
      LaunchTemplate:
        LaunchTemplateId: !Ref WebLaunchTemplate
        Version: !GetAtt WebLaunchTemplate.LatestVersionNumber
      MinSize: !Ref MinInstances
      MaxSize: !Ref MaxInstances
      DesiredCapacity: !Ref DesiredInstances
      VPCZoneIdentifier:
        - Fn::ImportValue: !Sub '${EnvironmentName}-PublicSubnetId'
        - Fn::ImportValue: !Sub '${EnvironmentName}-PublicSubnet2Id'
      TargetGroupARNs:
        - !Ref ALBTargetGroup
      HealthCheckType: ELB
      HealthCheckGracePeriod: 300
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-opt3-web-server'
          PropagateAtLaunch: true
        - Key: Environment
          Value: !Ref EnvironmentName
          PropagateAtLaunch: true

  WebCPUScalingPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref WebAutoScalingGroup
      PolicyType: TargetTrackingScaling
      TargetTrackingConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ASGAverageCPUUtilization
        TargetValue: 70.0

Outputs:
  WebsiteURL:
    Description: Application Load Balancer Website URL
    Value: !If [HasCertificateArn, !Sub 'https://${SubdomainName}', !Sub 'http://${ApplicationLoadBalancer.DNSName}']
  LoadBalancerDNS:
    Description: Application Load Balancer DNS Name
    Value: !GetAtt ApplicationLoadBalancer.DNSName
  DBServerPrivateIP:
    Description: Private IP of Dedicated DB Server
    Value: !GetAtt DBServerInstance.PrivateIp
  CustomDomainURL:
    Description: Custom Domain Website URL (png261.dev)
    Value: !Sub 'https://${SubdomainName}'
  RootDomain:
    Description: Root Domain Name
    Value: !Ref DomainName
  DnsRecordType:
    Description: DNS Record Type for Cloudflare / Route 53
    Value: 'CNAME'
  DnsRecordName:
    Description: DNS Record Name
    Value: !Ref SubdomainName
  DnsRecordValue:
    Description: DNS Record Value (ALB Target)
    Value: !GetAtt ApplicationLoadBalancer.DNSName
  CloudflareProxyGuide:
    Description: Cloudflare Setup Instructions
    Value: !Sub 'Add CNAME in Cloudflare: ${SubdomainName} -> ${ApplicationLoadBalancer.DNSName} (Proxied 🟧) with SSL/TLS Full (Strict).'

