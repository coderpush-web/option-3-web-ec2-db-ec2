AWSTemplateFormatVersion: '2010-09-09'
Description: 'Application Compute Module: Option 3 - Web on EC2 (Docker from ECR) + Dedicated Database on EC2'

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]

  InstanceType:
    Type: String
    Default: t3.micro

  WebVolumeSize:
    Type: Number
    Default: 20

  DBVolumeSize:
    Type: Number
    Default: 30

  DBPassword:
    Type: String
    NoEcho: true
    Default: SecretDBPass123!

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

  ImageTag:
    Type: String
    Default: latest

  DomainName:
    Type: String
    Default: png261.dev

  SubdomainName:
    Type: String
    Default: opt3-dev.png261.dev

Resources:
  DBServerInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref LatestAmiId
      IamInstanceProfile:
        Fn::ImportValue: !Sub '${EnvironmentName}-EC2InstanceProfileName'
      SubnetId:
        Fn::ImportValue: !Sub '${EnvironmentName}-PrivateSubnet1Id'
      SecurityGroupIds:
        - Fn::ImportValue: !Sub '${EnvironmentName}-DatabaseSecurityGroupId'
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: !Ref DBVolumeSize
            VolumeType: gp3
            DeleteOnTermination: true
      UserData:
        Fn::Base64: !Sub
          - |
            #!/bin/bash
            set -e
            dnf update -y
            dnf install -y mariadb105-server

            sed -i 's/^bind-address.*/bind-address = 0.0.0.0/' /etc/my.cnf.d/mariadb-server.cnf 2>/dev/null || true
            systemctl enable mariadb
            systemctl start mariadb

            mysql -e "CREATE DATABASE IF NOT EXISTS appdb;"
            mysql -e "CREATE USER IF NOT EXISTS 'appuser'@'%' IDENTIFIED BY '${Password}';"
            mysql -e "GRANT ALL PRIVILEGES ON appdb.* TO 'appuser'@'%';"
            mysql -e "FLUSH PRIVILEGES;"

            mysql -u appuser -p'${Password}' appdb -e "CREATE TABLE IF NOT EXISTS system_logs (id INT AUTO_INCREMENT PRIMARY KEY, service VARCHAR(50), message TEXT, created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP);"
            mysql -u appuser -p'${Password}' appdb -e "INSERT INTO system_logs (service, message) VALUES ('Database', 'Database Initialized on Dedicated EC2 Instance');"
          - Password: !Ref DBPassword
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-db-server'
        - Key: Environment
          Value: !Ref EnvironmentName

  WebServerInstance:
    Type: AWS::EC2::Instance
    DependsOn: DBServerInstance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref LatestAmiId
      IamInstanceProfile:
        Fn::ImportValue: !Sub '${EnvironmentName}-EC2InstanceProfileName'
      SubnetId:
        Fn::ImportValue: !Sub '${EnvironmentName}-PublicSubnetId'
      SecurityGroupIds:
        - Fn::ImportValue: !Sub '${EnvironmentName}-WebSecurityGroupId'
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: !Ref WebVolumeSize
            VolumeType: gp3
            DeleteOnTermination: true
      UserData:
        Fn::Base64: !Sub
          - |
            #!/bin/bash
            set -e
            dnf update -y
            dnf install -y docker aws-cli
            systemctl enable docker
            systemctl start docker
            usermod -aG docker ec2-user

            AWS_REGION="${AWS::Region}"
            ACCOUNT_ID="${AWS::AccountId}"
            IMAGE_URI="${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${EnvironmentName}-option-3-web-app:${ImageTag}"

            echo "Logging into Amazon ECR..."
            aws ecr get-login-password --region "${AWS::Region}" | docker login --username AWS --password-stdin "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com" || true

            echo "Pulling Docker image: $IMAGE_URI"
            docker pull "$IMAGE_URI" || true

            cat << 'SVC' > /etc/systemd/system/react-webapp.service
            [Unit]
            Description=Dockerized React Web App connected to EC2 MariaDB
            After=docker.service
            Requires=docker.service

            [Service]
            TimeoutStartSec=0
            Restart=always
            ExecStartPre=-/usr/bin/docker stop react-webapp
            ExecStartPre=-/usr/bin/docker rm react-webapp
            ExecStart=/usr/bin/docker run --name react-webapp -p 80:80 \
              -e APP_ENV=${EnvironmentName} \
              -e PORT=80 \
              -e DB_HOST=${DBPrivateIp} \
              -e DB_USER=appuser \
              -e DB_PASSWORD=${Password} \
              -e DB_NAME=appdb \
              ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${EnvironmentName}-option-3-web-app:${ImageTag}
            ExecStop=/usr/bin/docker stop react-webapp

            [Install]
            WantedBy=multi-user.target
            SVC

            systemctl daemon-reload
            systemctl enable react-webapp
            systemctl start react-webapp || true
          - DBPrivateIp: !GetAtt DBServerInstance.PrivateIp
            Password: !Ref DBPassword
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-web-server'
        - Key: Environment
          Value: !Ref EnvironmentName

  WebServerEIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      InstanceId: !Ref WebServerInstance
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-web-eip'
        - Key: Environment
          Value: !Ref EnvironmentName

Outputs:
  WebsiteURL:
    Description: Website URL
    Value: !Sub 'http://${WebServerEIP.PublicIp}'
  PublicIP:
    Description: Elastic IP
    Value: !Ref WebServerEIP
  DatabasePrivateIP:
    Description: Private IP of DB Server EC2
    Value: !GetAtt DBServerInstance.PrivateIp
  CustomDomainURL:
    Description: Custom Domain Website URL (png261.dev)
    Value: !Sub 'https://${SubdomainName}'
  RootDomain:
    Description: Root Domain Name
    Value: !Ref DomainName
  DnsRecordType:
    Description: DNS Record Type for Cloudflare / Route 53
    Value: 'A'
  DnsRecordName:
    Description: DNS Record Name
    Value: !Ref SubdomainName
  DnsRecordValue:
    Description: DNS Record Value (IPv4 Target)
    Value: !Ref WebServerEIP
